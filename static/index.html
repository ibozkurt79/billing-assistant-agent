<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Billing Help</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f5f5f5; color: #111;
           display: flex; flex-direction: column; height: 100vh; }
    header { background: #111; color: #fff; padding: 14px 20px; display: flex;
             justify-content: space-between; align-items: center; }
    header h1 { font-size: 18px; margin: 0; }
    header button { background: none; color: #fff; border: 1px solid #666; border-radius: 6px;
                    padding: 6px 12px; cursor: pointer; }
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
                max-width: 760px; width: 100%; margin: 0 auto; }
    .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; line-height: 1.45; }
    .user { background: #d52b1e; color: #fff; align-self: flex-end; }
    .bot { background: #fff; border: 1px solid #ddd; align-self: flex-start; }
    .bot a { color: #0a58ca; }
    .pending { color: #777; font-style: italic; }
    form { display: flex; gap: 8px; padding: 14px; max-width: 760px; width: 100%; margin: 0 auto; }
    input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
    form button { padding: 12px 18px; border: 0; border-radius: 8px; background: #111; color: #fff; cursor: pointer; }
    button:disabled, input:disabled { opacity: 0.5; }
    [hidden] { display: none !important; }
    #chat-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    #login-view { flex: 1; display: flex; align-items: center; justify-content: center; }
    #login-form { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 24px;
                  width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; }
    #login-form h2 { margin: 0 0 6px; font-size: 20px; }
    #login-form button { padding: 12px; border: 0; border-radius: 8px; background: #111; color: #fff; cursor: pointer; }
    .error { color: #d52b1e; font-size: 14px; min-height: 1em; margin: 0; }
    #user-email { font-size: 13px; color: #bbb; margin-right: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>Billing Help Assistant</h1>
    <div>
      <span id="user-email"></span>
      <button id="new-chat" hidden>New chat</button>
      <button id="sign-out" hidden>Sign out</button>
    </div>
  </header>

  <section id="login-view">
    <form id="login-form">
      <h2>Sign in</h2>
      <input id="email" type="email" placeholder="Email" autocomplete="username" required>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <p id="login-error" class="error"></p>
    </form>
  </section>

  <div id="chat-view" hidden>
    <main id="messages"></main>
    <form id="chat-form">
      <input id="input" placeholder="Type your question..." autocomplete="off" required>
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // Public config (identifies the project; not a secret)
    const firebaseConfig = {
      apiKey: "AIzaSyBiSY3i6vcUZQx1WXTZgiifEhBc9epbG1Y",
      authDomain: "gen-lang-client-0223243806.firebaseapp.com",
    };
    const auth = getAuth(initializeApp(firebaseConfig));

    const APP = "billing_assistant";
    const messages = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const loginView = document.getElementById("login-view");
    const chatView = document.getElementById("chat-view");
    const loginForm = document.getElementById("login-form");
    const loginError = document.getElementById("login-error");
    const signOutBtn = document.getElementById("sign-out");
    const newChatBtn = document.getElementById("new-chat");
    const userEmail = document.getElementById("user-email");

    let userId = null;     // set from the verified Firebase user, never typed by the user
    let sessionId = null;

    // Every API call goes through here: attaches a fresh ID token
    async function authFetch(url, options = {}) {
      const token = await auth.currentUser.getIdToken();   // auto-refreshes near expiry
      const r = await fetch(url, {
        ...options,
        headers: { ...(options.headers || {}), Authorization: `Bearer ${token}` },
      });
      if (r.status === 401) await signOut(auth);           // token rejected → back to login
      return r;
    }

    // Single place that switches between login and chat
    onAuthStateChanged(auth, (user) => {
      const signedIn = Boolean(user);
      loginView.hidden = signedIn;
      chatView.hidden = !signedIn;
      signOutBtn.hidden = !signedIn;
      newChatBtn.hidden = !signedIn;
      userEmail.textContent = signedIn ? user.email : "";
      userId = signedIn ? user.uid : null;
      sessionId = null;
      messages.innerHTML = "";
      if (signedIn) {
        addMessage("bot", "Hi! Ask me about bills, fees, autopay, plan changes, or disputes.");
        input.focus();
      }
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.textContent = "";
      try {
        await signInWithEmailAndPassword(auth,
          document.getElementById("email").value,
          document.getElementById("password").value);
        loginForm.reset();
      } catch (err) {
        console.error(err);
        loginError.textContent = "Sign-in failed. Check your email and password.";
      }
    });

    signOutBtn.addEventListener("click", () => signOut(auth));

    async function ensureSession() {
      if (sessionId) return sessionId;
      const r = await authFetch(`/apps/${APP}/users/${encodeURIComponent(userId)}/sessions`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}",
      });
      if (!r.ok) throw new Error(`create session failed: ${r.status}`);
      sessionId = (await r.json()).id;
      return sessionId;
    }

    // Escape everything first, then allow only [text](https://...) links, **bold**, and line breaks.
    function render(text) {
      const safe = text.replace(/&/g, "&amp;").replace(/</g, "&lt;")
                       .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      return safe
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
                 '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\n/g, "<br>");
    }

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    async function send(text) {
      addMessage("user", text);
      const bot = addMessage("bot", "Thinking...");
      bot.classList.add("pending");
      input.disabled = sendBtn.disabled = true;
      let answer = "";

      try {
        await ensureSession();
        const r = await authFetch("/run_sse", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            appName: APP,
            userId,
            sessionId,
            newMessage: { role: "user", parts: [{ text }] },
            streaming: true,
          }),
        });
        if (!r.ok) throw new Error(`run failed: ${r.status}`);

        // Read the SSE stream: events are separated by a blank line, each line starts with "data:"
        const reader = r.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const chunks = buffer.split("\n\n");
          buffer = chunks.pop();               // last piece may be incomplete; keep it
          for (const chunk of chunks) {
            for (const line of chunk.split("\n")) {
              if (!line.startsWith("data:")) continue;
              const event = JSON.parse(line.slice(5));
              if (event.error) throw new Error(event.error);
              const t = (event.content?.parts || [])
                .filter(p => p.text && !p.thought)  // skip tool calls and model "thoughts"
                .map(p => p.text).join("");
              if (!t) continue;
              answer = event.partial ? answer + t : t;  // partial = chunk; final = full text
              bot.classList.remove("pending");
              bot.innerHTML = render(answer);
              messages.scrollTop = messages.scrollHeight;
            }
          }
        }
        if (!answer) throw new Error("empty response");
      } catch (err) {
        console.error(err);
        bot.classList.remove("pending");
        bot.textContent = "Sorry, something went wrong. Please try again.";
      } finally {
        input.disabled = sendBtn.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      send(text); 
    });

    newChatBtn.addEventListener("click", () => {
      sessionId = null;
      messages.innerHTML = "";
      addMessage("bot", "New chat started. How can I help?");
    });
  </script>
</body>
</html>
